<title>Trainingsplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#12141a;
    --surface:#1a1d25;
    --surface-2:#232733;
    --surface-3:#2b303d;
    --border:#333947;
    --text:#eceae5;
    --text-dim:#8f95a6;
    --ok:#5fbf7a;

    --push:#e8964a;
    --pull:#4a90c4;
    --legs:#c4524a;
    --home:#5aa66d;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.display{
    font-family:'Oswald',system-ui,sans-serif;
    text-wrap:balance;
  }
  button{ font-family:inherit; }
  input[type="number"]{ font-family:'Inter',system-ui,sans-serif; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---- Menu view ---- */
  #view-menu{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:max(20px,env(safe-area-inset-top)) 16px 24px;
    gap:14px;
  }
  .menu-title{
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:4px 4px 6px;
    font-weight:600;
  }
  .menu-grid{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .menu-card{
    --accent: var(--text-dim);
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:6px solid var(--accent);
    border-radius:10px;
    padding:22px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .menu-card:active{ transform:scale(.98); background:var(--surface-2); }
  .menu-card .name{
    font-size:clamp(28px,7vw,36px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.02em;
    line-height:1;
  }
  .menu-card .sub{
    font-size:13px;
    color:var(--text-dim);
    letter-spacing:.02em;
  }
  #card-push{ --accent: var(--push); }
  #card-pull{ --accent: var(--pull); }
  #card-legs{ --accent: var(--legs); }
  #card-home{ --accent: var(--home); }

  /* ---- Workout view ---- */
  .workout-view{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .workout-header{
    position:sticky;
    top:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:max(18px,env(safe-area-inset-top)) 18px 16px;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .workout-header h1{
    font-size:30px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:0;
    border-bottom:4px solid var(--accent);
    padding-bottom:4px;
  }
  .back-btn{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .back-btn:active{ background:var(--surface-2); }
  .back-btn svg{ width:18px; height:18px; }

  .exercise-list{
    padding:4px 16px 40px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .exercise-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px 16px;
  }
  .exercise-card h2{
    font-size:17px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:0 0 12px;
    color:var(--text);
  }
  .metric-table{
    display:grid;
    grid-template-columns:40px repeat(3,1fr);
    gap:8px 8px;
    align-items:center;
  }
  .metric-table .col-head{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:center;
  }
  .metric-table .row-label{
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .metric-table input{
    background:var(--surface-3);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:18px;
    font-weight:600;
    text-align:center;
    padding:9px 2px;
    width:100%;
    font-variant-numeric:tabular-nums;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .metric-table input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .metric-table input.saved{
    border-color:var(--ok);
  }
  .metric-table input.kg-input{
    color:var(--text-dim);
    font-weight:500;
  }

  @media (prefers-reduced-motion:reduce){
    .menu-card, .metric-table input{ transition:none; }
  }

  [hidden]{ display:none !important; }
</style>

<div class="app">

  <section id="view-menu">
    <div class="menu-title">Trainingsplan</div>
    <div class="menu-grid">
      <button class="menu-card" id="card-push" data-page="push">
        <span class="name">Push</span>
        <span class="sub">Schultern · Brust · Trizeps</span>
      </button>
      <button class="menu-card" id="card-pull" data-page="pull">
        <span class="name">Pull</span>
        <span class="sub">Rücken · Bizeps</span>
      </button>
      <button class="menu-card" id="card-legs" data-page="legs">
        <span class="name">Legs</span>
        <span class="sub">Beine</span>
      </button>
      <button class="menu-card" id="card-home" data-page="home">
        <span class="name">Home</span>
        <span class="sub">Unterarme</span>
      </button>
    </div>
  </section>

  <section class="workout-view" id="view-push" hidden></section>
  <section class="workout-view" id="view-pull" hidden></section>
  <section class="workout-view" id="view-legs" hidden></section>
  <section class="workout-view" id="view-home" hidden></section>

</div>

<script>
(function(){
  var PAGES = {
    push: { name:"Push", accentVar:"--push", exercises:["Schulter Presse","Incline Press","Butterfly","Brust Presse","Überkopf Trizeps","Trizeps Pushdown","Seitheben","Hintere Schulter","Bauch"] },
    pull: { name:"Pull", accentVar:"--pull", exercises:["T-Bar","Lat Pulldown","Lat Row","Preacher Curl","Hammer Curl","Lat Überzüge","Bayesian Curl","Wrist Curl","Bauch"] },
    legs: { name:"Legs", accentVar:"--legs", exercises:["Hamstrings","Leg Extension","Leg Press","Calf Raises","Adduktoren","Bauch"] },
    home: { name:"Home", accentVar:"--home", exercises:["Reverse Curl","Wrist Curl Proniert","Wrist Curl","Supiniert"] }
  };

  var STORAGE_KEY = "trainingsplan_v1";

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveData(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  var data = loadData();

  function getEntry(pageKey, exercise){
    if(!data[pageKey]) data[pageKey] = {};
    var entry = data[pageKey][exercise];
    if(Array.isArray(entry)){
      // migrate old format (reps-only array) to {kg, reps}
      entry = { kg:["","",""], reps: entry };
    }
    if(!entry){
      entry = { kg:["","",""], reps:["","",""] };
    }
    data[pageKey][exercise] = entry;
    return entry;
  }

  var backIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';

  function buildPage(pageKey){
    var page = PAGES[pageKey];
    var view = document.getElementById("view-" + pageKey);
    var accent = getComputedStyle(document.documentElement).getPropertyValue(page.accentVar).trim();
    view.style.setProperty("--accent", accent);

    var header = document.createElement("div");
    header.className = "workout-header";
    header.innerHTML =
      '<h1>' + page.name + '</h1>' +
      '<button class="back-btn" aria-label="Zurück zum Menü">' + backIconSVG + '</button>';
    header.querySelector(".back-btn").addEventListener("click", function(){
      showView("menu");
    });
    view.appendChild(header);

    var list = document.createElement("div");
    list.className = "exercise-list";

    function makeInput(pageKey, exercise, metric, i, value, extraClass){
      var input = document.createElement("input");
      input.type = "number";
      input.inputMode = metric === "kg" ? "decimal" : "numeric";
      input.min = "0";
      if(metric === "kg") input.step = "0.5";
      input.placeholder = metric === "kg" ? "kg" : "0";
      input.value = value || "";
      if(extraClass) input.classList.add(extraClass);

      input.addEventListener("input", function(){
        var current = getEntry(pageKey, exercise);
        current[metric][i] = input.value;
        saveData(data);
        input.classList.add("saved");
        clearTimeout(input._savedTimer);
        input._savedTimer = setTimeout(function(){
          input.classList.remove("saved");
        }, 600);
      });

      return input;
    }

    page.exercises.forEach(function(exercise){
      var entry = getEntry(pageKey, exercise);
      var card = document.createElement("div");
      card.className = "exercise-card";

      var h2 = document.createElement("h2");
      h2.textContent = exercise;
      card.appendChild(h2);

      var table = document.createElement("div");
      table.className = "metric-table";

      // header row: corner + Satz 1/2/3
      table.appendChild(document.createElement("div"));
      for(var h = 0; h < 3; h++){
        var head = document.createElement("div");
        head.className = "col-head";
        head.textContent = "Satz " + (h + 1);
        table.appendChild(head);
      }

      // kg row
      var kgLabel = document.createElement("div");
      kgLabel.className = "row-label";
      kgLabel.textContent = "kg";
      table.appendChild(kgLabel);
      for(var k = 0; k < 3; k++){
        table.appendChild(makeInput(pageKey, exercise, "kg", k, entry.kg[k], "kg-input"));
      }

      // reps row
      var repsLabel = document.createElement("div");
      repsLabel.className = "row-label";
      repsLabel.textContent = "Wdh.";
      table.appendChild(repsLabel);
      for(var r = 0; r < 3; r++){
        table.appendChild(makeInput(pageKey, exercise, "reps", r, entry.reps[r]));
      }

      card.appendChild(table);
      list.appendChild(card);
    });

    view.appendChild(list);
  }

  function showView(key){
    document.getElementById("view-menu").hidden = key !== "menu";
    Object.keys(PAGES).forEach(function(pageKey){
      document.getElementById("view-" + pageKey).hidden = key !== pageKey;
    });
    window.scrollTo(0, 0);
  }

  Object.keys(PAGES).forEach(buildPage);

  document.querySelectorAll(".menu-card").forEach(function(card){
    card.addEventListener("click", function(){
      showView(card.getAttribute("data-page"));
    });
  });

  showView("menu");
})();
</script>
